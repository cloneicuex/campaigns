name: Send LIC daily countdown

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lic-daily.yml
  schedule:
    - cron: "30 11 20-30 9 *"
    - cron: "30 11 1-22 10 *"
    - cron: "10 16 19 9 *"
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - live

permissions:
  contents: read
  id-token: write

concurrency:
  group: lic-2026-daily-campaign
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CAMPAIGN_ENDPOINT: https://conference.joyandharvest.com/api/campaign/daily
      OIDC_AUDIENCE: lic2026-campaign
      TEST_SCHEDULE: "10 16 19 9 *"
    steps:
      - name: Select safe run mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          today="$(TZ=America/Chicago date +%F)"
          mode="live"

          if [[ "$EVENT_NAME" == "push" || "$EVENT_SCHEDULE" == "$TEST_SCHEDULE" || "$INPUT_MODE" == "dry-run" ]]; then
            mode="dry-run"
          elif [[ "$today" < "2026-09-20" || "$today" > "2026-10-22" ]]; then
            echo "Outside the LIC 2026 delivery window; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - name: Request GitHub identity token
        if: steps.mode.outputs.skip != 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"
          token="$(jq -er '.value' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Inspect approved identity claims
        if: steps.mode.outputs.skip != 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os

          payload = os.environ["OIDC_TOKEN"].split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          allowed = ["iss", "aud", "repository", "ref", "event_name", "workflow_ref", "sub", "iat", "nbf", "exp"]
          print(json.dumps({key: claims.get(key) for key in allowed}, indent=2))
          PY

      - name: Run campaign
        if: steps.mode.outputs.skip != 'true'
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          endpoint="$CAMPAIGN_ENDPOINT"
          if [[ "$RUN_MODE" == "dry-run" ]]; then
            endpoint="$endpoint?dry=1"
          fi

          response="$(curl --silent --show-error --fail-with-body             --retry 2 --retry-all-errors             -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Accept: application/json"             "$endpoint")"

          jq . <<< "$response"
          if [[ "$RUN_MODE" == "dry-run" ]]; then
            jq -e '.configured == true and .campaignDay != null' <<< "$response" >/dev/null
          else
            jq -e '.ok == true and (.failed // 0) == 0' <<< "$response" >/dev/null
          fi
